<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 4800" width="390" height="4800">
  <title>Artboard - Mobile Homepage (390px)</title>
  <defs>
    <style>
      @font-face { font-family: 'Coolvetica'; src: local('Coolvetica'), url('/coolvetica.ttf'); font-weight: normal; }
      @font-face { font-family: 'Rascal'; src: local('Rascal'), url('/rascal.ttf'); font-weight: normal; }
      @font-face { font-family: 'Schoolbell'; src: local('Schoolbell'), url('/Schoolbell-Regular.ttf'); font-weight: normal; }
      .text-coolvetica { font-family: 'Coolvetica', system-ui, sans-serif; }
      .text-rascal { font-family: 'Rascal', cursive, sans-serif; }
      .text-schoolbell { font-family: 'Schoolbell', cursive, sans-serif; }
      .stroke-charcoal { stroke: #171717; stroke-width: 2px; }
      .stroke-charcoal-thick { stroke: #171717; stroke-width: 3px; }
      .stroke-charcoal-heavy { stroke: #171717; stroke-width: 4px; }
      .shadow-hard { filter: drop-shadow(4px 4px 0px #171717); }
      .shadow-hard-lg { filter: drop-shadow(6px 6px 0px #171717); }
    </style>
  </defs>
  <g id="Artboard_Mobile_Homepage_390x4800">
    <rect width="390" height="4800" fill="#E9ECD9" />

    <!-- Mobile Nav Bar -->
    <g id="Navbar_Mobile" transform="translate(16, 16)">
      <rect width="358" height="60" rx="18" fill="#E9ECD9" class="stroke-charcoal shadow-hard" />
      <text x="20" y="38" fill="#171717" font-size="20" font-weight="bold" class="text-coolvetica">SOURBOO</text>
      <rect x="250" y="14" width="90" height="32" rx="16" fill="#E61E6E" class="stroke-charcoal" />
      <text x="295" y="35" text-anchor="middle" fill="#FFFFFF" font-size="13" class="text-coolvetica">BAG [0]</text>
    </g>

    <!-- Mobile Hero -->
    <g id="Hero_Mobile" transform="translate(20, 100)">
      <text x="0" y="30" fill="#4C8B1D" font-size="12" class="text-coolvetica" letter-spacing="1">SNACK DIARY • VOL. 02</text>
      <text x="0" y="70" fill="#171717" font-size="38" class="text-coolvetica">THE SOURBOO WAY,</text>
      <text x="0" y="110" fill="#E61E6E" font-size="34" class="text-rascal">cravings come first.</text>
      <rect width="350" height="260" rx="16" fill="#FFFFFF" class="stroke-charcoal shadow-hard" y="130" />
      <text x="175" y="270" text-anchor="middle" fill="#171717" font-size="16" class="text-coolvetica">[ hero-placeholder.webp ]</text>
      <rect x="0" y="410" width="350" height="48" rx="24" fill="#E61E6E" class="stroke-charcoal shadow-hard" />
      <text x="175" y="440" text-anchor="middle" fill="#FFFFFF" font-size="18" class="text-schoolbell">shop the crunch →</text>
    </g>

    <!-- Mobile Dossier Deck -->
    <g id="Dossier_Mobile" transform="translate(20, 600)">
      <text x="0" y="30" fill="#171717" font-size="28" class="text-coolvetica">THE SOUR DOSSIER</text>
      <rect width="350" height="440" rx="20" fill="#FFFFFF" class="stroke-charcoal shadow-hard" y="50" />
      <text x="175" y="240" text-anchor="middle" fill="#171717" font-size="16" class="text-coolvetica">[ side-eye.webp ]</text>
      <text x="20" y="340" fill="#171717" font-size="22" class="text-coolvetica">SIDE EYE SOUR</text>
      <text x="20" y="365" fill="#4C8B1D" font-size="14" class="text-schoolbell">Lemon & Chaat Masala • ₹399</text>
      <rect x="20" y="390" width="310" height="40" rx="20" fill="#171717" />
      <text x="175" y="415" text-anchor="middle" fill="#BFEA5A" font-size="14" class="text-coolvetica">QUICK ADD +</text>
    </g>

    <!-- Mobile Footer -->
    <g id="Footer_Mobile" transform="translate(0, 4400)">
      <rect width="390" height="400" fill="#171717" />
      <text x="24" y="60" fill="#BFEA5A" font-size="24" class="text-coolvetica">SOURBOO SNACKS</text>
      <text x="24" y="90" fill="#E9ECD9" font-size="14" class="text-schoolbell">cravings@sourboo.com</text>
      <text x="24" y="120" fill="#E61E6E" font-size="16" class="text-coolvetica">STAY SOUR. NEVER QUIET.</text>
    </g>
  </g>
</svg>