<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 3600" width="1440" height="3600">
  <title>Artboard - About Page / The Pickle Project (1440px)</title>
  <defs>
    <style>
      @font-face { font-family: 'Coolvetica'; src: local('Coolvetica'), url('/coolvetica.ttf'); font-weight: normal; }
      @font-face { font-family: 'Rascal'; src: local('Rascal'), url('/rascal.ttf'); font-weight: normal; }
      @font-face { font-family: 'Schoolbell'; src: local('Schoolbell'), url('/Schoolbell-Regular.ttf'); font-weight: normal; }
      .text-coolvetica { font-family: 'Coolvetica', system-ui, sans-serif; }
      .text-rascal { font-family: 'Rascal', cursive, sans-serif; }
      .text-schoolbell { font-family: 'Schoolbell', cursive, sans-serif; }
      .stroke-charcoal { stroke: #171717; stroke-width: 2px; }
      .stroke-charcoal-thick { stroke: #171717; stroke-width: 3px; }
      .stroke-charcoal-heavy { stroke: #171717; stroke-width: 4px; }
      .shadow-hard { filter: drop-shadow(4px 4px 0px #171717); }
      .shadow-hard-lg { filter: drop-shadow(6px 6px 0px #171717); }
    </style>
  </defs>
  <g id="Artboard_Desktop_About_1440x3600">
    <rect width="1440" height="3600" fill="undefined" />

    <!-- 1. Founder Feature Hero -->
    <g id="About_Cover_Feature" transform="translate(64, 100)">
      <g id="Founder_Portrait">
        <rect width="520" height="660" rx="24" fill="#FFFFFF" class="stroke-charcoal-thick shadow-hard-lg" transform="rotate(-1.5, 260, 330)" />
        <rect x="14" y="14" width="492" height="632" rx="16" fill="#E8DEC8" transform="rotate(-1.5, 260, 330)" />
        <text x="260" y="320" text-anchor="middle" fill="#171717" font-size="22" class="text-coolvetica" transform="rotate(-1.5, 260, 330)">[ about-cover.JPG • Sakshi &amp; Founders ]</text>
        <rect x="420" y="-10" width="100" height="32" fill="#FFFF88" opacity="0.85" transform="rotate(12)" />
        <g transform="translate(240, 640) rotate(3)">
          <rect width="320" height="40" rx="20" fill="#FFFF88" class="stroke-charcoal shadow-hard-sm" />
          <text x="160" y="25" text-anchor="middle" fill="#171717" font-size="15" class="text-schoolbell">The Founders (Also Chief Pickle Addicts) ↵</text>
        </g>
      </g>
      <g id="Founder_Letter" transform="translate(580, 40)">
        <text x="0" y="30" fill="#4C8B1D" font-size="14" class="text-coolvetica" letter-spacing="1">OUR STORY // SOURBOO SNACK DIARY</text>
        <text x="0" y="90" fill="#171717" font-size="52" class="text-coolvetica">THE PICKLE PROJECT THAT</text>
        <rect x="0" y="110" width="440" height="58" rx="8" fill="#E61E6E" />
        <text x="220" y="152" text-anchor="middle" fill="#FFFFFF" font-size="48" class="text-coolvetica">GOT OUT OF HAND.</text>
        <text x="0" y="210" fill="#4C8B1D" font-size="24" class="text-schoolbell">"Born from a serious love for tangy, punchy and slightly unhinged flavours."</text>
        <text x="0" y="260" fill="#171717" font-size="17" class="text-sans">Sourboo started in a tiny kitchen with an obsession for real, unapologetic crunch.</text>
        <text x="0" y="290" fill="#171717" font-size="17" class="text-sans">We were tired of sweet, mushy pickles that tasted like vinegar water and regret.</text>
        <text x="0" y="320" fill="#171717" font-size="17" class="text-sans">So we started experimenting with raw mangoes, wild tamarind, garden gherkins</text>
        <text x="0" y="350" fill="#171717" font-size="17" class="text-sans">and whole-roasted spices — crafting the exact tangy, spicy punch we craved at 2 AM.</text>
        <text x="0" y="410" fill="#E61E6E" font-size="24" class="text-schoolbell">xx - Sakshi &amp; Team</text>
      </g>
    </g>

    <!-- 2. Value Props Green Pill Bar -->
    <g id="Value_Props_Bar" transform="translate(0, 880)">
      <rect width="1440" height="72" fill="#4C8B1D" class="stroke-charcoal-thick" />
      <text x="200" y="44" fill="#FFFFFF" font-size="20" class="text-coolvetica">✦ BIG ON FLAVOUR</text>
      <text x="540" y="44" fill="#FFFFFF" font-size="20" class="text-coolvetica">✦ REAL INGREDIENTS</text>
      <text x="900" y="44" fill="#FFFFFF" font-size="20" class="text-coolvetica">✦ FOR REAL LIFE CRAVINGS</text>
      <text x="1240" y="44" fill="#BFEA5A" font-size="18" class="text-coolvetica">✦ SMALL BATCH</text>
    </g>

    <!-- 3. Our Story Narrative Section -->
    <g id="Our_Story_Section" transform="translate(64, 1020)">
      <g transform="translate(0, 40)">
        <text x="0" y="30" fill="#4C8B1D" font-size="14" class="text-coolvetica" letter-spacing="1">KITCHEN EXPERIMENTS // CHILDHOOD NOSTALGIA</text>
        <text x="0" y="90" fill="#171717" font-size="48" class="text-coolvetica">OUR </text>
        <rect x="90" y="48" width="160" height="50" rx="8" fill="#FFFF88" />
        <text x="170" y="86" text-anchor="middle" fill="#171717" font-size="48" class="text-coolvetica">STORY</text>
        <text x="0" y="160" fill="#171717" font-size="17" class="text-sans">If you are here, we assume you love sour or are curious enough to try it.</text>
        <text x="0" y="195" fill="#171717" font-size="17" class="text-sans">We spent years around food and drinks, obsessing over why sour was treated like a side.</text>
        <text x="0" y="230" fill="#171717" font-size="17" class="text-sans">Childhood raw mango obsessions, street chaat cravings, and lime-drenched snacks never left us.</text>
        <text x="0" y="280" fill="#171717" font-size="17" class="text-sans">We set out to create pickles that aren't hidden inside a curry, but eaten proudly</text>
        <text x="0" y="315" fill="#171717" font-size="17" class="text-sans">straight from the jar — with crackers, sandwiches, midnight grilled cheeses.</text>
      </g>
      <g transform="translate(760, 20) rotate(2)">
        <rect width="520" height="380" rx="20" fill="#FFFFFF" class="stroke-charcoal shadow-hard" />
        <rect x="14" y="14" width="492" height="352" rx="14" fill="#E8DEC8" />
        <text x="260" y="190" text-anchor="middle" fill="#171717" font-size="20" class="text-coolvetica">[ recipe-2.webp • Pickle Jar Family ]</text>
      </g>
    </g>

    <!-- 4. The Sourboo Way (3 Pillars) -->
    <g id="The_Sourboo_Way" transform="translate(64, 1540)">
      <rect width="1312" height="540" rx="28" fill="#E9ECD9" class="stroke-charcoal shadow-hard" />
      <text x="656" y="60" text-anchor="middle" fill="#171717" font-size="44" class="text-coolvetica">THE SOURBOO WAY</text>
      <text x="656" y="96" text-anchor="middle" fill="#4C8B1D" font-size="20" class="text-schoolbell">Three rules we never break.</text>

      <g transform="translate(40, 140)">
        <!-- Card 1 -->
        <rect width="380" height="340" rx="18" fill="#FFFFFF" class="stroke-charcoal shadow-hard" />
        <rect x="24" y="24" width="160" height="30" rx="6" fill="#FFFF88" />
        <text x="104" y="44" text-anchor="middle" fill="#171717" font-size="12" class="text-coolvetica">01 // THE INGREDIENTS</text>
        <text x="24" y="95" fill="#171717" font-size="24" class="text-coolvetica">Simple, real ingredients</text>
        <text x="24" y="140" fill="#555555" font-size="15" class="text-sans">Farm-fresh gherkins, cold-pressed</text>
        <text x="24" y="165" fill="#555555" font-size="15" class="text-sans">mustard oil, sun-dried tamarind, and</text>
        <text x="24" y="190" fill="#555555" font-size="15" class="text-sans">whole-roasted spices. Zero preservatives.</text>

        <!-- Card 2 -->
        <rect x="420" width="380" height="340" rx="18" fill="#FFFFFF" class="stroke-charcoal shadow-hard" />
        <rect x="444" y="24" width="150" height="30" rx="6" fill="#E61E6E" />
        <text x="519" y="44" text-anchor="middle" fill="#FFFFFF" font-size="12" class="text-coolvetica">02 // THE PROFILE</text>
        <text x="444" y="95" fill="#171717" font-size="24" class="text-coolvetica">Bold flavours</text>
        <text x="444" y="140" fill="#555555" font-size="15" class="text-sans">Sour that hits you right between</text>
        <text x="444" y="165" fill="#555555" font-size="15" class="text-sans">the eyes. Tangy, spicy, crunchy goodness</text>
        <text x="444" y="190" fill="#555555" font-size="15" class="text-sans">engineered to wake up your palate.</text>

        <!-- Card 3 -->
        <rect x="840" width="380" height="340" rx="18" fill="#FFFFFF" class="stroke-charcoal shadow-hard" />
        <rect x="864" y="24" width="150" height="30" rx="6" fill="#BFEA5A" />
        <text x="939" y="44" text-anchor="middle" fill="#171717" font-size="12" class="text-coolvetica">03 // THE PROCESS</text>
        <text x="864" y="95" fill="#171717" font-size="24" class="text-coolvetica">Made in small batches</text>
        <text x="864" y="140" fill="#555555" font-size="15" class="text-sans">Handcrafted in limited runs to keep</text>
        <text x="864" y="165" fill="#555555" font-size="15" class="text-sans">the crunch razor-sharp. Never mass-</text>
        <text x="864" y="190" fill="#555555" font-size="15" class="text-sans">produced in giant industrial vats.</text>
      </g>
    </g>

    <!-- 5. Behind The Brand (Pink Ripped Paper Banner) -->
    <g id="Behind_The_Brand_Banner" transform="translate(0, 2180)">
      <rect width="1440" height="260" fill="#E61E6E" class="stroke-charcoal-thick" />
      <text x="720" y="60" text-anchor="middle" fill="#FFFFFF" font-size="44" class="text-coolvetica">BEHIND THE BRAND</text>
      <g transform="translate(160, 110)">
        <rect width="250" height="50" rx="25" fill="#FFFFFF" class="stroke-charcoal shadow-hard-sm" />
        <text x="125" y="32" text-anchor="middle" fill="#171717" font-size="16" class="text-schoolbell">✓ A lot of taste testing</text>

        <rect x="280" width="250" height="50" rx="25" fill="#FFFFFF" class="stroke-charcoal shadow-hard-sm" />
        <text x="405" y="32" text-anchor="middle" fill="#171717" font-size="16" class="text-schoolbell">✓ Countless fridge raids</text>

        <rect x="560" width="280" height="50" rx="25" fill="#FFFFFF" class="stroke-charcoal shadow-hard-sm" />
        <text x="700" y="32" text-anchor="middle" fill="#171717" font-size="16" class="text-schoolbell">✓ Debates over "perfect tang"</text>

        <rect x="870" width="250" height="50" rx="25" fill="#FFFFFF" class="stroke-charcoal shadow-hard-sm" />
        <text x="995" y="32" text-anchor="middle" fill="#171717" font-size="16" class="text-schoolbell">✓ Growing pickle obsession</text>
      </g>
    </g>

    <!-- 6. Closing Section (Still Curious?) -->
    <g id="About_Closing_Section" transform="translate(64, 2560)">
      <g transform="translate(40, 0) rotate(-1.5)">
        <rect width="520" height="380" rx="20" fill="#FFFFFF" class="stroke-charcoal shadow-hard" />
        <rect x="14" y="14" width="492" height="352" rx="14" fill="#F4E8D6" />
        <text x="260" y="190" text-anchor="middle" fill="#171717" font-size="20" class="text-coolvetica">[ recipe-1.jpg • Grilled Cheese Pairing ]</text>
      </g>
      <g transform="translate(640, 50)">
        <text x="0" y="50" fill="#171717" font-size="48" class="text-coolvetica">STILL CURIOUS?</text>
        <text x="0" y="95" fill="#4C8B1D" font-size="22" class="text-schoolbell">Try a jar. Your tastebuds will thank you.</text>
        <g transform="translate(0, 150)">
          <rect width="180" height="50" rx="25" fill="#4C8B1D" class="stroke-charcoal shadow-hard" />
          <text x="90" y="32" text-anchor="middle" fill="#FFFFFF" font-size="17" class="text-coolvetica">SHOP NOW →</text>

          <rect x="210" width="180" height="50" rx="25" fill="#E61E6E" class="stroke-charcoal shadow-hard" />
          <text x="300" y="32" text-anchor="middle" fill="#FFFFFF" font-size="17" class="text-coolvetica">GET IN TOUCH</text>
        </g>
      </g>
    </g>
  </g>
</svg>