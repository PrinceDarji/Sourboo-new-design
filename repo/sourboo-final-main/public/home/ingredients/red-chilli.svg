    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5482E"/>
      <stop offset="0.38" stop-color="#BD2015"/>
      <stop offset="0.75" stop-color="#8A1009"/>
      <stop offset="1" stop-color="#5C0805"/>
